project_id = "sfmaokxbltmjtwsgztpn"

[auth]
enabled = true
site_url = "https://app.medlabinteractive.com"
additional_redirect_urls = [
  "https://app.medlabinteractive.com/auth/callback",
  "https://medlabinteractive.com/auth/callback",
  "http://localhost:3015/auth/callback",
  "http://127.0.0.1:3015/auth/callback"
]
jwt_expiry = 3600
jwt_issuer = "http://127.0.0.1:54321/auth/v1"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"
